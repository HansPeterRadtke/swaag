[project]
name = "swaag"
version = "0.1.0"
description = "SWAAG: a selfhosted working autonomous agent for a local llama.cpp server"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hans-Peter Radtke" }]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = [
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "requests>=2.31,<3",
  "websocket-client>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/HansPeterRadtke/swaag"
Repository = "https://github.com/HansPeterRadtke/swaag"
Issues = "https://github.com/HansPeterRadtke/swaag/issues"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-testmon>=2.1,<3",
]
semantic-transformers = [
  "numpy>=1.26,<3",
  "torch>=2,<3",
  "transformers>=4.40,<5"
]
official-benchmarks = [
  "swebench>=4,<5",
  "terminal-bench>=0.2,<0.3; python_version >= '3.12'"
]
publish = [
  "build>=1,<2",
  "twine>=5,<6"
]

[project.scripts]
swaag = "swaag.cli:main"
swaag-benchmark = "swaag.benchmark.benchmark_runner:main"
swaag-wakeup-dispatcher = "swaag.wakeup_dispatcher:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swaag" = [
  "assets/*.toml",
  "assets/prompts/*.txt",
  "benchmark/fixtures/**/*",
  "benchmark/terminal_tasks/**/*"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::requests.exceptions.RequestsDependencyWarning",
  'ignore::DeprecationWarning:google.protobuf.internal.well_known_types',
  'ignore:The ``declarative_base\\(\\)`` function is now available.*:Warning:terminal_bench.db',
]
markers = [
  "code_correctness: deterministic software-correctness tests with no model dependency",
  "agent_test: cached agent behavior tests",
]
