extensions:
  health_check:
    endpoint: 127.0.0.1:13502

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:13501

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  file:
    path: /data/var/swaag/telemetry/otlp.json
    create_directory: true
    flush_interval: 1s
    rotation:
      max_megabytes: 64
      max_days: 14
      max_backups: 8
      localtime: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      output_paths: [stdout]
      error_output_paths: [stderr]
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
