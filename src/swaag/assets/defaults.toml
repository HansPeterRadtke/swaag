# ============================================================
# swaag configuration defaults
#
# Override precedence (lowest to highest):
#   1. this file  — packaged defaults, defines every key
#   2. config/local.toml  — local override file, deep-merged at startup
#   3. SWAAG_CONFIG env var  — explicit path to an additional override
#   4. SWAAG__SECTION__KEY=value env vars  — per-key overrides (highest)
#
# Distinction between config types:
#   server/model facts  — discovered from the live backend where supported
#   user-tunable policy — safe to experiment with (ratios, limits, previews)
#   derived allocations — computed at runtime from facts × policy; never set here
#
# Sections are ordered by practical tuning likelihood / risk:
#   top  — most likely to tune, safest to change
#   bottom — less likely to tune, riskier to get wrong
# ============================================================

# -----------------------------------------------------------
# [model] — SERVER/MODEL FACTS AND OFFLINE FALLBACKS
# Live llama.cpp calls read per-slot n_ctx from /props. context_limit is the
# explicit fallback for fake/non-probing clients and offline replay only.
# -----------------------------------------------------------
[model]
base_url = "http://127.0.0.1:14829"
completion_endpoint = "/completion"
tokenize_endpoint = "/tokenize"
health_endpoint = "/health"
profile_name = "small_fast"
# Optional explicit model/revision identifier. When empty, SWAAG fingerprints the live server properties.
model_identity = ""
# OpenTelemetry GenAI provider discriminator; custom providers are permitted by the convention.
provider_name = "llama.cpp"
structured_output_mode = "server_schema"
# Cache-first record mode is the normal runtime default. Set cache_enabled=false for an explicitly uncached live run.
cache_enabled = true
cache_mode = "record"
# Empty resolves to <sessions.root parent>/llm-model-cache.json.
cache_path = ""
timeout_seconds = 120
connect_timeout_seconds = 10
simple_timeout_seconds = 60
structured_timeout_seconds = 120
verification_timeout_seconds = 150
benchmark_timeout_seconds = 240
progress_poll_seconds = 5.0
max_retries = 1
temperature = 0.0
top_p = 1.0
seed = 42
context_limit = 2048
# Optional extra text stops. Leave empty to use the connected model's EOS behavior.
stop = []

# -----------------------------------------------------------
# [runtime] — OPERATIONAL LIMITS  (most user-tunable)
# Adjust these first when tuning agent behavior for a new task scope.
# -----------------------------------------------------------
[runtime]
tool_call_budget = 16
max_total_actions = 36
verification_confidence_threshold = 0.7
capture_model_io = true
lean_on_overflow = true
strict_budget = true
max_repeated_action_occurrences = 2
completion_evaluation_enabled = true
tool_timeout_seconds = 10
background_poll_seconds = 0.1

# -----------------------------------------------------------
# [tools] — TOOL EXPOSURE  (most user-tunable)
# enabled: which tools the agent may use.
# read_roots: filesystem roots the agent is allowed to read from.
# allow_side_effect_tools: set true only if destructive writes are intended.
# -----------------------------------------------------------
[tools]
enabled = ["echo", "time_now", "calculator", "list_files", "read_file", "read_text", "history_search", "history_window", "history_analyze", "read_artifact", "list_attachments", "read_attachment", "extract_attachment", "browser_search", "browser_browse", "terminal", "notes", "edit_text", "write_file", "run_tests", "shell_command", "poll_process", "kill_process", "wait_seconds", "schedule_wakeup", "list_wakeups", "cancel_wakeup"]
read_roots = ["."]
allow_stateful_tools = true
allow_side_effect_tools = false
staged_discovery = true

# -----------------------------------------------------------
# [context] — TOKEN RESERVE POLICY  (moderate risk)
# reserved_* values are operation minimums. Per-kind output ratios below are
# desired maxima; they do not exclude full-fidelity input that fits with the
# operation minimum and safety. A larger reserve is retried after observed
# output starvation.
# -----------------------------------------------------------
[context]
reserved_response_tokens = 256
reserved_summary_tokens = 196
safety_margin_tokens = 64
max_compaction_rounds = 4
allow_estimate_fallback = true
compact_on_overflow = true

# -----------------------------------------------------------
# [sessions] — SESSION STORAGE
# Rarely changed. root: where session histories are stored.
# -----------------------------------------------------------
[sessions]
root = "/data/var/swaag/sessions"
write_projections = true

# -----------------------------------------------------------
# [environment] — SHELL / WORKSPACE SETTINGS
# shell_executable: shell used for shell_command tool.
# command_timeout_seconds: hard timeout per shell command.
# -----------------------------------------------------------
[environment]
shell_executable = "bash"
command_timeout_seconds = 30
max_capture_chars = 4000
aubro_entrypoint = ""
aubro_src = ""
aubro_timeout_seconds = 45
aubro_max_text_chars = 4000
aubro_max_results = 5
aubro_max_links = 5

# -----------------------------------------------------------
# [logging] — LOGGING LEVEL
# -----------------------------------------------------------
[logging]
level = "INFO"

# -----------------------------------------------------------
# [notes] — WORKING NOTES SUBSYSTEM LIMITS
# -----------------------------------------------------------
[notes]
max_notes = 32
max_note_chars = 2000
max_total_chars = 16000

# -----------------------------------------------------------
# [reader] — SEQUENTIAL FILE READER LIMITS
# -----------------------------------------------------------
[reader]
default_chunk_chars = 4000
default_overlap_chars = 0
max_chunk_chars = 12000

# -----------------------------------------------------------
# [editor] — FILE EDITOR SETTINGS
# -----------------------------------------------------------
[editor]
create_backups = false
backup_suffix = ".bak"
allow_writes = true
# Empty means unrestricted. Benchmarks with immutable-workspace contracts populate this at runtime.
allowed_write_paths = []

# -----------------------------------------------------------
# -----------------------------------------------------------
[compression]
# Compression is driven by actual next-call token pressure, not message count or character limits.

# -----------------------------------------------------------
# -----------------------------------------------------------
[prompts]
standard_system_template = "system_standard.txt"
lean_system_template = "system_lean.txt"
action_template = "agent_action_user.txt"
summary_system_template = "summary_system.txt"
summary_template = "summary_user.txt"
tool_result_projection_system_template = "tool_result_projection_system.txt"
tool_result_projection_template = "tool_result_projection_user.txt"
evidence_projection_system_template = "evidence_projection_system.txt"
evidence_projection_template = "evidence_projection_user.txt"
completion_evaluation_system_template = "completion_evaluation_system.txt"
completion_evaluation_template = "completion_evaluation_user.txt"
caller_structured_output_system_template = "caller_structured_output_system.txt"
caller_structured_output_template = "caller_structured_output_user.txt"
communication_status_system_template = "communication_status_system.txt"
communication_status_template = "communication_status_user.txt"

# -----------------------------------------------------------
# [budget_policy] — DESIRED OUTPUT AND ESTIMATOR-SAFETY RATIOS
# ADVANCED TUNING — changes here affect all model calls globally.
# Output ratios produce desired headroom, not mandatory input exclusions.
# Percentage safety applies only when exact tokenizer counting is unavailable.
# -----------------------------------------------------------
[budget_policy]
structured_output_json_factor_default = 1.50
structured_output_json_floor_tokens = 192
structured_output_schema_factor = 1.25
structured_output_schema_floor_tokens = 16

[budget_policy.call_classes]
action = "large"
summary = "medium"
tool_result_projection = "medium"
evidence_projection = "medium"
completion_evaluation = "small"
caller_structured_output = "small"
communication_status = "small"
history_analysis = "small"
notes_compaction = "small"
doctor = "tiny"
benchmark_quality_judge = "small"

[budget_policy.output_ratio]
tiny = 0.04
small = 0.07
medium = 0.12
large = 0.18

[budget_policy.output_floor_ratio]
tiny = 0.02
small = 0.04
medium = 0.07
large = 0.10

[budget_policy.output_ratio_by_kind]
action = 0.30
summary = 0.18
tool_result_projection = 0.14
evidence_projection = 0.14
completion_evaluation = 0.10
caller_structured_output = 0.12
communication_status = 0.10
notes_compaction = 0.10
doctor = 0.05
benchmark_quality_judge = 0.12

[budget_policy.output_floor_ratio_by_kind]
action = 0.22
summary = 0.10
tool_result_projection = 0.08
evidence_projection = 0.08
completion_evaluation = 0.06
caller_structured_output = 0.06
communication_status = 0.06
notes_compaction = 0.06
doctor = 0.03
benchmark_quality_judge = 0.08

[budget_policy.structured_output_json_factor_by_contract]
agent_action = 1.10
summary = 1.10
tool_result_projection = 1.10
evidence_projection = 1.10
completion_evaluation = 1.10
caller_structured_output = 1.10
communication_status = 1.10
notes_compaction = 1.10
yes_no = 1.10
benchmark_quality = 1.10

[budget_policy.safety_ratio]
tiny = 0.05
small = 0.06
medium = 0.08
large = 0.10

[history_search]
max_results = 12
token_score = 4
exact_score = 8
type_bonus = 2
preview_chars = 600


# -----------------------------------------------------------
# [embedding_index] — OPTIONAL DERIVED SEMANTIC INDEX
# Canonical history remains exact SQLite events. This index is rebuildable.
# -----------------------------------------------------------
[embedding_index]
enabled = false
base_url = ""
endpoint = "/v1/embeddings"
model = ""
timeout_seconds = 30.0
fields = ["situation", "action", "reason"]
max_results = 8

# -----------------------------------------------------------
# [archive] — IMMUTABLE HISTORY ARCHIVE SHARDS
# Archiving copies exact events into read-only SQLite shards. Removal is opt-in.
# -----------------------------------------------------------
[archive]
enabled = true
remove_active_after_archive = false
min_age_days = 30
min_event_count = 100

# Raw bytes are content-addressed outside disposable session projections.
# Extraction is opt-in through a model-selected tool and never runs on upload.
[attachments]
max_upload_bytes = 104857600
preview_chars = 12000
extraction_timeout_seconds = 300
all2text_command = "all2text"

# -----------------------------------------------------------
# [mcp] — EXTERNAL INTEROPERABILITY BOUNDARY
# -----------------------------------------------------------
[mcp]
enabled = false
transport = "stdio"

# -----------------------------------------------------------
# [communication] — PARALLEL COMMUNICATION/CONTROL SERVICE
# Empty model_base_url reuses the main configured model endpoint.
# -----------------------------------------------------------
[communication]
enabled = false
model_base_url = ""
max_concurrent_requests = 4
enabled_tools = ["time_now", "calculator", "history_search", "history_window", "agent_status_lookup", "agent_control"]
host = "127.0.0.1"
port = 8765
poll_seconds = 0.2

[external_benchmarks]
root = ".swaag/external_benchmarks"
smoke_timeout_seconds = 90
full_timeout_seconds = 1800

[external_benchmarks.model_server]
preflight_enabled = true
healthcheck_timeout_seconds = 5
retry_attempts = 3
retry_sleep_seconds = 2.0

[external_benchmarks.terminal_bench]
compose_probe_timeout_seconds = 5
compose_download_timeout_seconds = 60
allow_compose_download = true

[external_benchmarks.agent_generation]
default_max_instances = 1
clone_timeout_seconds = 300
agent_timeout_seconds = 900
agent_context_limit = 2048
model_timeout_seconds = 180
model_structured_timeout_seconds = 240
allow_stateful_tools = true
allow_side_effect_tools = true
runtime_max_total_actions = 40
runtime_tool_call_budget = 24
candidate_file_limit = 2
file_excerpt_char_limit = 900
issue_prompt_char_limit = 1200
completion_max_tokens = 192
solver_max_attempts = 2
summary_max_chars = 120
find_max_chars = 800
replace_max_chars = 1600
git_remote_base_url = "https://github.com"
model_name_or_path = "swaag/real-agent-cli"
prompt_template = """
You are working inside the current repository checkout.
Decide what the task requires, choose any needed inspection or edits, and keep the final response concise.
Use repo-relative paths when you mention paths.

Repository: {repo}
Instance: {instance_id}

Task details:
{problem_statement}

Additional verification context:
{fail_to_pass_tests}

Hints:
{hints_text}
"""
empty_patch_retry_prompt = """
You have not produced any file changes yet for this repository task.
Reconsider the task and decide whether a concrete file change is needed.
Use real repo-relative file paths when you mention paths.
Repository: {repo}
Instance: {instance_id}
Task details:
{problem_statement}
Additional verification context:
{fail_to_pass_tests}
Hints:
{hints_text}
"""

[external_benchmarks.targets.swebench_lite]
enabled = true
description = "Official SWE-bench Lite evaluation via swebench.harness.run_evaluation."
workdir = "."
default_variables = { dataset_name_args = "--dataset_name princeton-nlp/SWE-bench_Lite", namespace_args = "--namespace none" }
preflight_commands = [["docker", "version"]]
smoke_command = ["python3", "-m", "swebench.harness.run_evaluation", "--help"]
full_command = ["python3", "-m", "swebench.harness.run_evaluation", "@args:{dataset_name_args}", "--predictions_path", "{predictions_path}", "@args:{instance_ids_args}", "@args:{namespace_args}", "@args:{cache_args}", "--max_workers", "1", "--run_id", "{run_id}", "--report_dir", "{output_dir}"]
required_env = []
required_paths = ["{predictions_path}"]
allowed_path_literals = ["gold"]
artifact_globs = ["evaluation_results/**/*", "logs/**/*"]

