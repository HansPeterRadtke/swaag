# ============================================================
# swaag configuration defaults
#
# Override precedence (lowest to highest):
#   1. this file  — packaged defaults, defines every key
#   2. config/local.toml  — local project override file, deep-merged at startup
#   3. explicit config_paths supplied by the caller, in caller order
#   4. SWAAG_CONFIG env var  — explicit path to an additional override
#   5. SWAAG__SECTION__KEY=value env vars  — per-key overrides (highest)
#
# Distinction between config types:
#   server/model facts  — discovered from the live backend where supported
#   user-tunable policy — safe to experiment with (ratios, limits, previews)
#   derived allocations — computed at runtime from facts × policy; never set here
#
# Sections are ordered by practical tuning likelihood / risk:
#   top  — most likely to tune, safest to change
#   bottom — less likely to tune, riskier to get wrong
# ============================================================

# -----------------------------------------------------------
# [model] — SERVER/MODEL FACTS AND OFFLINE FALLBACKS
# Live llama.cpp calls read per-slot n_ctx from /props. context_limit is the
# explicit fallback for fake/non-probing clients and offline replay only.
# -----------------------------------------------------------
[model]
base_url = "http://127.0.0.1:14829"
completion_endpoint = "/completion"
tokenize_endpoint = "/tokenize"
health_endpoint = "/health"
profile_name = "small_fast"
# Maximum independent semantic decisions requested from the model in one call.
# 1 is the measured small-model setting; larger values deliberately permit fused calls.
max_semantic_responsibilities_per_call = 6
# Optional explicit model/revision identifier. When empty, SWAAG fingerprints the live server properties.
model_identity = ""
# OpenTelemetry GenAI provider discriminator; custom providers are permitted by the convention.
provider_name = "llama.cpp"
# Optional environment-variable name containing a bearer token. The secret is
# read only at request time and is never included in config fingerprints.
api_key_env = ""
structured_output_mode = "server_schema"
# Cache-first record mode is the normal runtime default. Set cache_enabled=false for an explicitly uncached live run.
cache_enabled = true
cache_mode = "record"
# Empty resolves to <sessions.root parent>/llm-model-cache.json.
cache_path = ""
# Positive byte/entry limits. Refuse over-capacity recording without deleting replay evidence.
cache_max_bytes = 134217728
cache_max_entries = 16384
# Fixed lock-file count. Change only while this cassette is not in use.
cache_lock_stripes = 128
timeout_seconds = 120
connect_timeout_seconds = 10
simple_timeout_seconds = 60
structured_timeout_seconds = 120
verification_timeout_seconds = 150
benchmark_timeout_seconds = 240
# Native-local deadlock backstop used only while trustworthy backend progress and
# streamed activity are both absent. It never acts as a normal inference deadline.
# Four hours is deliberately far above retained multi-thousand-second live calls.
fail_safe_timeout_seconds = 14400
progress_poll_seconds = 5.0
max_retries = 1
temperature = 0.0
top_p = 1.0
seed = 42
context_limit = 2048
# A live remote OpenAI-compatible backend may omit capacity from GET /models.
# Keep this unset (zero) unless its deployed limit is known explicitly; the
# packaged offline context_limit above must not silently govern a live backend.
remote_context_limit_fallback = 0
# Optional extra text stops. Leave empty to use the connected model's EOS behavior.
stop = []

# -----------------------------------------------------------
# [runtime] — OPERATIONAL LIMITS  (most user-tunable)
# Adjust these first when tuning agent behavior for a new task scope.
# -----------------------------------------------------------
[runtime]
lean_on_overflow = true
max_validation_recovery_cycles = 2
completion_evaluation_enabled = true
# Durable unresolved-question capacity: reject additions, never silently discard.
# Higher limits retain more open questions but consume more model context.
# Positive counts: pending controls per session and nonterminal requests per backend.
# Admission rejects at capacity; accepted work and exact replay remain intact.
max_pending_controls = 256
max_pending_inference = 256
max_open_questions = 128
max_open_question_chars = 65536
tool_timeout_seconds = 10

# -----------------------------------------------------------
# [tools] — TOOL EXPOSURE  (most user-tunable)
# enabled: which tools the agent may use.
# read_roots: filesystem roots the agent is allowed to read from.
# allow_side_effect_tools: set true only if destructive writes are intended.
# -----------------------------------------------------------
[tools]
enabled = ["echo", "time_now", "calculator", "agent_workspace", "list_files", "read_file", "read_text", "search_in_file", "search_repo", "history_search", "history_window", "history_analyze", "read_artifact", "list_attachments", "read_attachment", "terminal", "notes", "prompt_instructions", "questions", "revise_question", "report_progress", "shared_state", "edit_text", "write_file", "run_tests", "shell_command", "poll_process", "kill_process", "wait_seconds", "schedule_wakeup", "list_wakeups", "cancel_wakeup"]
read_roots = ["."]
allow_stateful_tools = true
allow_side_effect_tools = false
# Stage tool schemas/guidance and filesystem discovery behind model-selected calls.
# False exposes all schemas and the full automatic workspace inventory.
staged_discovery = true

# -----------------------------------------------------------
# [context] — TOKEN RESERVE POLICY  (moderate risk)
# reserved_* values are operation minimums. Per-kind output ratios below are
# desired maxima; they do not exclude full-fidelity input that fits with the
# operation minimum and safety. A larger reserve is retried after observed
# output starvation.
# -----------------------------------------------------------
[context]
reserved_response_tokens = 256
reserved_summary_tokens = 196
safety_margin_tokens = 64
max_compaction_rounds = 4
allow_estimate_fallback = true
compact_on_overflow = true
# Resource-safety cap for semantic reduction subcalls only. Full-fidelity action
# admission is unchanged; this bound applies only after measured overflow requires
# semantic reduction. 0 explicitly disables the additional cap.
semantic_reduction_max_input_tokens = 8192
# Hard ceiling for one hierarchical semantic-reduction tree. The runtime derives
# the actual allowance from exact source size/context capacity, never exceeding this.
semantic_reduction_max_calls = 256
# Positive in-memory memo count; FIFO eviction only causes recomputation.
max_token_count_cache_entries = 4096

# -----------------------------------------------------------
# [sessions] — SESSION STORAGE
# Rarely changed. root: where session histories are stored.
# -----------------------------------------------------------
[sessions]
root = "/data/var/swaag/sessions"
write_projections = true

# -----------------------------------------------------------
# [environment] — SHELL / WORKSPACE SETTINGS
# shell_executable: shell used for shell_command tool.
# Shell/process timeout is runtime.tool_timeout_seconds, the single source of truth.
# -----------------------------------------------------------
[agent_data]
# Agent-owned persistent workspace for general calculations, experiments, notes,
# downloaded knowledge, and doability tests that must not pollute user projects.
# The agent_workspace tool confines execution to this root with bubblewrap.
root = "/data/var/swaag/agent-data"
sandbox_backend = "bwrap"
python_executable = "/usr/bin/python3"
command_timeout_seconds = 30
max_capture_chars = 12000

[environment]
shell_executable = "bash"
max_capture_chars = 4000
track_shell_file_changes = true

# -----------------------------------------------------------
# [logging] — LOGGING LEVEL
# -----------------------------------------------------------
[logging]
level = "INFO"
file_path = "/data/var/swaag/logs/operations.jsonl"
queue_capacity = 4096
max_bytes = 10485760
backup_count = 5

# -----------------------------------------------------------
# [notes] — WORKING NOTES SUBSYSTEM LIMITS
# -----------------------------------------------------------
[notes]
max_notes = 32
max_note_chars = 2000
max_total_chars = 16000

# Durable model-authored instructions are scoped to explicit model-call kinds.
# Limits are storage safeguards, not prompt-selection targets; every matching
# instruction is included exactly and accounted by the central compiler.
[prompt_instructions]
max_instructions = 32
max_instruction_chars = 2000
max_total_chars = 16000

# -----------------------------------------------------------
# [reader] — SEQUENTIAL FILE READER LIMITS
# -----------------------------------------------------------
[reader]
default_chunk_chars = 4000
default_overlap_chars = 0
max_chunk_chars = 12000

# -----------------------------------------------------------
# [editor] — FILE EDITOR SETTINGS
# -----------------------------------------------------------
[editor]
create_backups = false
backup_suffix = ".bak"
allow_writes = true
# Empty means unrestricted. Benchmarks with immutable-workspace contracts populate this at runtime.
allowed_write_paths = []

# -----------------------------------------------------------
# -----------------------------------------------------------
[compression]
# Compression is driven by actual next-call token pressure, not message count or character limits.

# -----------------------------------------------------------
# -----------------------------------------------------------
[prompts]
standard_system_template = "system_standard.txt"
lean_system_template = "system_lean.txt"
action_template = "agent_action_user.txt"
lean_action_template = "agent_action_lean_user.txt"
summary_system_template = "summary_system.txt"
summary_template = "summary_user.txt"
tool_result_projection_system_template = "tool_result_projection_system.txt"
tool_result_projection_template = "tool_result_projection_user.txt"
evidence_projection_system_template = "evidence_projection_system.txt"
evidence_projection_template = "evidence_projection_user.txt"
completion_evaluation_system_template = "completion_evaluation_system.txt"
completion_evaluation_template = "completion_evaluation_user.txt"
caller_structured_output_system_template = "caller_structured_output_system.txt"
caller_structured_output_template = "caller_structured_output_user.txt"
communication_status_system_template = "communication_status_system.txt"
communication_status_template = "communication_status_user.txt"
response_relevance_system_template = "response_relevance_system.txt"
response_relevance_template = "response_relevance_user.txt"
audio_rendering_system_template = "audio_rendering_system.txt"
audio_rendering_template = "audio_rendering_user.txt"
presentation_evaluation_system_template = "presentation_evaluation_system.txt"
presentation_evaluation_template = "presentation_evaluation_user.txt"
note_selection_system_template = "note_selection_system.txt"
note_selection_template = "note_selection_user.txt"
prompt_instruction_selection_system_template = "prompt_instruction_selection_system.txt"
prompt_instruction_selection_template = "prompt_instruction_selection_user.txt"
prompt_instruction_projection_system_template = "prompt_instruction_projection_system.txt"
prompt_instruction_projection_template = "prompt_instruction_projection_user.txt"

# -----------------------------------------------------------
# [budget_policy] — DESIRED OUTPUT AND ESTIMATOR-SAFETY RATIOS
# ADVANCED TUNING — changes here affect all model calls globally.
# Output ratios produce desired headroom, not mandatory input exclusions.
# Percentage safety applies only when exact tokenizer counting is unavailable.
# -----------------------------------------------------------
[budget_policy]
structured_output_json_factor_default = 1.50
structured_output_json_floor_tokens = 192
structured_output_schema_factor = 1.25
structured_output_schema_floor_tokens = 16

[budget_policy.call_classes]
action = "large"
exact_word_count_repair = "small"
summary = "medium"
tool_result_projection = "medium"
evidence_projection = "medium"
note_selection = "small"
prompt_instruction_selection = "small"
prompt_instruction_projection = "medium"
completion_evaluation = "small"
caller_structured_output = "small"
communication_status = "small"
orchestrator_interaction = "small"
response_relevance = "small"
audio_rendering = "small"
presentation_evaluation = "small"
history_analysis = "small"
notes_compaction = "small"
doctor = "tiny"
benchmark_quality_judge = "small"

[budget_policy.output_ratio]
tiny = 0.04
small = 0.07
medium = 0.12
large = 0.18

[budget_policy.output_floor_ratio]
tiny = 0.02
small = 0.04
medium = 0.07
large = 0.10

[budget_policy.output_ratio_by_kind]
action = 0.30
exact_word_count_repair = 0.12
summary = 0.18
tool_result_projection = 0.14
evidence_projection = 0.14
note_selection = 0.08
prompt_instruction_selection = 0.08
prompt_instruction_projection = 0.14
completion_evaluation = 0.10
caller_structured_output = 0.12
communication_status = 0.10
orchestrator_interaction = 0.08
response_relevance = 0.12
audio_rendering = 0.12
presentation_evaluation = 0.08
notes_compaction = 0.10
doctor = 0.05
benchmark_quality_judge = 0.12

[budget_policy.output_floor_ratio_by_kind]
action = 0.22
exact_word_count_repair = 0.06
summary = 0.10
tool_result_projection = 0.08
evidence_projection = 0.08
note_selection = 0.05
prompt_instruction_selection = 0.05
prompt_instruction_projection = 0.08
completion_evaluation = 0.06
caller_structured_output = 0.06
communication_status = 0.06
orchestrator_interaction = 0.04
response_relevance = 0.06
audio_rendering = 0.06
presentation_evaluation = 0.04
notes_compaction = 0.06
doctor = 0.03
benchmark_quality_judge = 0.08

[budget_policy.structured_output_json_floor_by_contract]
# Compact structured operations use smaller contract-specific floors while rich
# action/completion contracts retain the conservative global default.
evidence_projection = 32
communication_status = 96
orchestrator_interaction = 48
tool_result_verbatim_selection = 32
tool_result_best_anchor = 32
history_best_anchor = 32

[budget_policy.structured_output_json_factor_by_contract]
agent_action = 1.10
summary = 1.10
tool_result_projection = 1.10
evidence_projection = 1.10
note_selection = 1.10
prompt_instruction_selection = 1.10
prompt_instruction_projection = 1.10
completion_evaluation = 1.10
caller_structured_output = 1.10
communication_status = 1.10
orchestrator_interaction = 1.10
response_relevance = 1.10
audio_rendering = 1.10
presentation_evaluation = 1.10
notes_compaction = 1.10
yes_no = 1.10
benchmark_quality = 1.10

[budget_policy.safety_ratio]
tiny = 0.05
small = 0.06
medium = 0.08
large = 0.10

[history_search]
max_results = 12
token_score = 4
exact_score = 8
type_bonus = 2
preview_chars = 600


# -----------------------------------------------------------
# [embedding_index] — OPTIONAL DERIVED SEMANTIC INDEX
# Canonical history remains exact SQLite events. This index is rebuildable.
# -----------------------------------------------------------
[embedding_index]
enabled = false
base_url = ""
endpoint = "/v1/embeddings"
model = ""
timeout_seconds = 30.0
fields = ["just_happened", "situation", "action", "reason"]
max_results = 8

# Raw bytes are content-addressed outside disposable session projections.
# Extraction is opt-in through a model-selected tool and never runs on upload.
[attachments]
max_upload_bytes = 104857600
preview_chars = 12000

# -----------------------------------------------------------
# [mcp] — EXTERNAL INTEROPERABILITY BOUNDARY
# -----------------------------------------------------------
[mcp]
enabled = false
# "stdio", "streamable_http" on the loopback communication service, or "both".
transport = "stdio"

[mcp.authorization]
# Disabled by default. Required before exposing the loopback MCP-only listener through a TLS reverse proxy.
enabled = false
resource_uri = ""
authorization_servers = []
allowed_origins = []
introspection_url = ""
introspection_client_id = ""
# Secret value is resolved only from this environment variable when authorization is enabled.
introspection_client_secret_env = "SWAAG_MCP_INTROSPECTION_CLIENT_SECRET"
required_scopes = []
timeout_seconds = 5.0

# -----------------------------------------------------------
# [a2a.authorization] — OPTIONAL A2A HTTP BEARER BOUNDARY
# The communication listener remains loopback-only; expose only A2A routes through TLS.
# -----------------------------------------------------------
[external_tools.mcp_servers]
# External MCP servers are opt-in. Named sub-tables may configure local stdio
# commands or remote Streamable HTTP URLs. Remote credentials/headers should be
# supplied through per-server `header_env` mappings (HTTP header -> environment
# variable name), never literal model/tool content. For expiring credentials/OAuth, a
# per-server `credential_command` may return JSON headers plus `expires_at_epoch`;
# SWAAG refreshes before expiry and once after 401/403 without persisting the token.
# Optional servers disappear from
# the capability catalog when unavailable instead of failing SWAAG.

[a2a.authorization]
enabled = false
public_base_url = ""
# Secret value is read only from this environment variable when authorization is enabled.
bearer_token_env = "SWAAG_A2A_BEARER_TOKEN"

[a2a.push]
enabled = false
credential_key_env = ""
allowed_hosts = []
timeout_seconds = 15.0
max_attempts = 5
retry_base_seconds = 1.0

[a2a.extended_card]
enabled = false

[a2a.card_signing]
enabled = false
private_key_env = ""
key_id = ""
jwks_url = ""

# -----------------------------------------------------------
# [communication] — PARALLEL COMMUNICATION/CONTROL SERVICE
# Empty model_base_url reuses the main configured model endpoint.
# -----------------------------------------------------------
[communication]
enabled = false
model_base_url = ""
# Required when the communication endpoint advertises a different model ID than [model].
model_profile_name = ""
model_identity = ""
# Set only when the remote communication endpoint does not advertise context capacity.
remote_context_limit_fallback = 0
max_concurrent_requests = 4
# Positive counts, separate from execution concurrency. Reject rather than grow unbounded.
max_active_workers = 128
max_pending_requests = 128
# Initial status/control response cap. Output-recovery may grow this only when
# constrained generation actually exhausts the cap.
status_max_output_tokens = 192
enabled_tools = ["agent_workspace", "list_files", "read_file", "read_text", "search_in_file", "search_repo", "read_artifact", "time_now", "system_resources", "calculator", "history_search", "history_window", "agent_status_lookup", "agent_control", "orchestration_control", "background_work", "questions", "revise_question", "worker_questions", "report_progress"]
host = "127.0.0.1"
port = 8765
poll_seconds = 0.2
# Explicit opt-in: finish_only does not dispatch queued background plans.
# authorized_backlog starts user-authorized plans only when foreground work is idle.
idle_work_mode = "finish_only"
# Pending/held plan count, positive; overflow rejects without deleting work.
max_background_plans = 128

[communication.open_webui_artifacts]
enabled = false
public_base_url = ""
signing_secret_env = ""
ttl_seconds = 900

# Optional named model endpoints available to orchestration worker nodes. The
# default worker model remains [model].base_url; routes are selected explicitly
# by the orchestrator/user and never guessed from task wording.
[communication.model_routes]

[external_benchmarks]
root = ".swaag/external_benchmarks"
smoke_timeout_seconds = 90
full_timeout_seconds = 1800

[external_benchmarks.model_server]
preflight_enabled = true
healthcheck_timeout_seconds = 5
retry_attempts = 3
retry_sleep_seconds = 2.0

[external_benchmarks.terminal_bench]
compose_probe_timeout_seconds = 5
compose_download_timeout_seconds = 60
allow_compose_download = true

[external_benchmarks.agent_generation]
default_max_instances = 1
clone_timeout_seconds = 300
agent_timeout_seconds = 900
model_timeout_seconds = 180
model_structured_timeout_seconds = 240
allow_stateful_tools = true
allow_side_effect_tools = true
solver_max_attempts = 2
git_remote_base_url = "https://github.com"
model_name_or_path = "swaag/real-agent-cli"
prompt_template = """
You are working inside the current repository checkout.
Decide what the task requires, choose any needed inspection or edits, and keep the final response concise.
Use repo-relative paths when you mention paths.

Repository: {repo}
Instance: {instance_id}

Task details:
{problem_statement}

Additional verification context:
{fail_to_pass_tests}

Hints:
{hints_text}
"""
empty_patch_retry_prompt = """
You have not produced any file changes yet for this repository task.
Reconsider the task and decide whether a concrete file change is needed.
Use real repo-relative file paths when you mention paths.
Repository: {repo}
Instance: {instance_id}
Task details:
{problem_statement}
Additional verification context:
{fail_to_pass_tests}
Hints:
{hints_text}
"""

[external_benchmarks.targets.swebench_lite]
enabled = true
description = "Official SWE-bench Lite evaluation via swebench.harness.run_evaluation."
workdir = "."
default_variables = { dataset_name_args = "--dataset_name princeton-nlp/SWE-bench_Lite", namespace_args = "--namespace none" }
preflight_commands = [["docker", "version"]]
smoke_command = ["python3", "-m", "swebench.harness.run_evaluation", "--help"]
full_command = ["python3", "-m", "swebench.harness.run_evaluation", "@args:{dataset_name_args}", "--predictions_path", "{predictions_path}", "@args:{instance_ids_args}", "@args:{namespace_args}", "@args:{cache_args}", "--max_workers", "1", "--run_id", "{run_id}", "--report_dir", "{output_dir}"]
required_env = []
required_paths = ["{predictions_path}"]
allowed_path_literals = ["gold"]
artifact_globs = ["evaluation_results/**/*", "logs/**/*"]

